<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Media Ears - Emotion-Based Podcast Recommender</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f8f9fa;
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 720px;
      margin: 40px auto;
      background: #fff;
      padding: 2rem;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    textarea {
      width: 100%;
      height: 100px;
      font-size: 1rem;
      padding: 10px;
    }
    button {
      margin-top: 1rem;
      padding: 10px 20px;
      font-size: 1rem;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    ul {
      list-style: none;
      padding: 0;
    }
    li {
      margin-bottom: 1.5rem;
      background: #f1f1f1;
      padding: 1rem;
      border-radius: 6px;
    }
    .desc {
      margin-top: 0.5rem;
    }
    .toggle {
      color: #007bff;
      cursor: pointer;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎧 Media Ears</h1>
    <p>Type how you're feeling and get podcast recommendations!</p>

    <textarea id="userInput" placeholder="Describe your mood or what you're looking for..."></textarea>
    <button onclick="getRecommendations()">Get Recommendations</button>

    <div id="output">
      <h3>Detected Emotion:</h3>
      <p id="emotionResult">—</p>

      <h3>Recommended Podcasts:</h3>
      <ul id="recommendations"></ul>
    </div>
  </div>

  <script>
    function truncateText(text, limit = 200) {
      if (text.length <= limit) return text;
      return text.substring(0, limit) + "...";
    }

    function createRecommendationItem(rec) {
      const li = document.createElement('li');
      const fullDesc = rec.description;
      const shortDesc = truncateText(fullDesc);

      li.innerHTML = `
        <strong>${rec.title}</strong>
        <p class="desc" id="desc-${rec.title}">${shortDesc}</p>
        <span class="toggle" onclick="toggleDescription(this, '${rec.title}', \`${fullDesc.replace(/`/g, "\\`")}\`)">Show More</span>
      `;
      return li;
    }

    function toggleDescription(element, title, fullText) {
      const descEl = document.getElementById(`desc-${title}`);
      if (element.innerText === "Show More") {
        descEl.innerText = fullText;
        element.innerText = "Show Less";
      } else {
        descEl.innerText = truncateText(fullText);
        element.innerText = "Show More";
      }
    }

    async function getRecommendations() {
      const input = document.getElementById('userInput').value;

      const emotionRes = await fetch('/predict', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({text: input})
      });
      const emotionData = await emotionRes.json();
      document.getElementById('emotionResult').innerText = emotionData.emotion || "No emotion detected";

      const recRes = await fetch('/recommend', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({text: input})
      });
      const recData = await recRes.json();
      const recList = document.getElementById('recommendations');
      recList.innerHTML = "";
      recData.recommendations.forEach(rec => {
        recList.appendChild(createRecommendationItem(rec));
      });
    }
  </script>
</body>
</html>
